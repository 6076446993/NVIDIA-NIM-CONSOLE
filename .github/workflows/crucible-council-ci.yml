name: Crucible & AI Council Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  regression:
    name: Console regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact console revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify PowerShell console parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('./NimConsole.ps1', './NexusCodingWorkflow.ps1', './tests/NexusCodingWorkflowRegression.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($script + ': ' + $_.Message) }
              exit 1
            }
          }
      - name: Run coding workflow lineage regression
        shell: pwsh
        run: ./tests/NexusCodingWorkflowRegression.ps1

      - name: Verify Python helper and requirements
        shell: pwsh
        run: |
          python -m py_compile AIcollaborationcouncilgate.py
          $requirements = Get-Content requirements.txt | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') }
          if ($requirements.Count -lt 4) { throw 'requirements.txt is incomplete.' }
          if ((Get-Content requirements.txt -Raw) -match '(^|\n)\s*(import|from|Set-Location)\s') {
            throw 'requirements.txt contains executable source instead of dependency declarations.'
          }

  crucible:
    name: The Crucible
    uses: 6076446993/The-Crucible/.github/workflows/the-crucible.yml@f3217f922d2aaa88cda7873220553be2a3b6121c
    with:
      core_ref: f3217f922d2aaa88cda7873220553be2a3b6121c
      config_path: .thecrucible.json
      run_workload: true
      weekly_maintenance: false
      dependency_review: false

  council:
    name: AI Collaboration Council
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact console revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build bounded review diff
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --no-ext-diff --unified=3 HEAD^ HEAD | head -c 12000 > council-diff.txt
          else
            git show --format= --no-ext-diff --unified=3 HEAD | head -c 12000 > council-diff.txt
          fi

      - name: Require deployed AI Collaboration boundary
        env:
          AI_COLLABORATION_BASE_URL: https://ai-collaboration-bwkm.onrender.com
          AI_COLLABORATION_BEARER_TOKEN: ${{ secrets.AI_COLLABORATION_BEARER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AI_COLLABORATION_BASE_URL"
          test -n "$AI_COLLABORATION_BEARER_TOKEN"

      - name: Request governed council review
        env:
          AI_COLLABORATION_BASE_URL: https://ai-collaboration-bwkm.onrender.com
          AI_COLLABORATION_BEARER_TOKEN: ${{ secrets.AI_COLLABORATION_BEARER_TOKEN }}
        shell: python
        run: |
          import json, os, pathlib, urllib.request
          base = os.environ["AI_COLLABORATION_BASE_URL"].rstrip("/")
          token = os.environ["AI_COLLABORATION_BEARER_TOKEN"]
          diff = pathlib.Path("council-diff.txt").read_text(encoding="utf-8", errors="replace")
          body = json.dumps({
              "model": "nexus-review",
              "messages": [
                  {"role": "system", "content": "Review this code change for syntax, security, regression risk, and Nexus contract violations. Return a concise review. Council output is advisory and grants no execution authorization."},
                  {"role": "user", "content": diff or "(empty diff)"}
              ],
              "temperature": 0.1
          }).encode()
          request = urllib.request.Request(
              base + "/v1/chat/completions",
              data=body,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          content = result["choices"][0]["message"]["content"]
          metadata = result.get("ai_collaboration", {})
          if metadata.get("authorizationGranted") is True:
              raise SystemExit("AI Collaboration must never grant execution authorization.")
          print(content)
          print("Council review completed; Crucible remains the verification authority.")

  gate:
    name: Crucible & AI Council Gate
    needs: [regression, crucible, council]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce both independent results
        shell: bash
        run: |
          set -euo pipefail
          echo "Regression: ${{ needs.regression.result }}"
          echo "Crucible:   ${{ needs.crucible.result }}"
          echo "Council:    ${{ needs.council.result }}"
          test "${{ needs.regression.result }}" = success
          test "${{ needs.crucible.result }}" = success
          test "${{ needs.council.result }}" = success
